<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 70" width="320" height="70">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563EB" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Logo Mark Icon -->
  <g transform="translate(10, 5)" filter="url(#shadow)">
    <!-- Monitor Base & Stand -->
    <rect x="10" y="8" width="44" height="34" rx="6" fill="url(#primaryGrad)"/>
    <rect x="14" y="12" width="36" height="24" rx="3" fill="#FFFFFF"/>
    <!-- Code / Screen Lines -->
    <rect x="18" y="16" width="16" height="3" rx="1.5" fill="#2563EB"/>
    <rect x="18" y="22" width="28" height="3" rx="1.5" fill="#7C3AED"/>
    <rect x="18" y="28" width="22" height="3" rx="1.5" fill="#38BDF8"/>
    <!-- Stand -->
    <path d="M28 42 L36 42 L38 48 L26 48 Z" fill="url(#primaryGrad)"/>
    <rect x="22" y="48" width="20" height="4" rx="2" fill="#1E293B"/>

    <!-- Graduation Cap Accent -->
    <g transform="translate(32, -4) scale(0.65)">
      <polygon points="20,2 38,10 20,18 2,10" fill="#F59E0B"/>
      <path d="M7 13 L7 22 C7 28 33 28 33 22 L33 13" fill="#D97706"/>
      <path d="M38 10 L38 24" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
      <circle cx="38" cy="25" r="2" fill="#F59E0B"/>
    </g>
  </g>

  <!-- Text Section -->
  <g transform="translate(78, 12)">
    <text x="0" y="24" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="21" letter-spacing="0.5" fill="#0F172A">
      PERFECT
    </text>
    <text x="96" y="24" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="800" font-size="21" letter-spacing="0.5" fill="url(#primaryGrad)">
      .
    </text>
    <text x="0" y="42" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="600" font-size="11.5" letter-spacing="2.2" fill="#64748B">
      COMPUTER EDUCATION
    </text>
  </g>
</svg>
