<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#F5F3FF"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="softGlow">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2563EB" flood-opacity="0.15"/>
    </filter>
    <filter id="cardShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Ambient Glow & Shapes -->
  <circle cx="300" cy="250" r="210" fill="url(#glowGrad)"/>
  <circle cx="480" cy="120" r="40" fill="#E0F2FE" opacity="0.6"/>
  <circle cx="100" cy="380" r="30" fill="#EDE9FE" opacity="0.6"/>
  
  <!-- Grid Dots Background -->
  <g opacity="0.25" fill="#3B82F6">
    <circle cx="100" cy="80" r="2.5"/><circle cx="130" cy="80" r="2.5"/><circle cx="160" cy="80" r="2.5"/>
    <circle cx="100" cy="110" r="2.5"/><circle cx="130" cy="110" r="2.5"/><circle cx="160" cy="110" r="2.5"/>
    <circle cx="100" cy="140" r="2.5"/><circle cx="130" cy="140" r="2.5"/><circle cx="160" cy="140" r="2.5"/>
    <circle cx="440" cy="380" r="2.5"/><circle cx="470" cy="380" r="2.5"/><circle cx="500" cy="380" r="2.5"/>
    <circle cx="440" cy="410" r="2.5"/><circle cx="470" cy="410" r="2.5"/><circle cx="500" cy="410" r="2.5"/>
  </g>

  <!-- Central Desk / Table Surface -->
  <ellipse cx="300" cy="410" rx="240" ry="24" fill="#E2E8F0" opacity="0.7"/>

  <!-- Main Workstation / Desktop Monitor -->
  <g transform="translate(140, 90)" filter="url(#softGlow)">
    <!-- Monitor Stand -->
    <path d="M150 250 L170 250 L176 300 L144 300 Z" fill="#94A3B8"/>
    <rect x="120" y="296" width="80" height="8" rx="4" fill="#64748B"/>

    <!-- Monitor Outer Body -->
    <rect x="20" y="20" width="280" height="190" rx="14" fill="#0F172A"/>
    <!-- Screen Display -->
    <rect x="30" y="30" width="260" height="165" rx="8" fill="url(#screenGrad)"/>
    
    <!-- Code Editor UI on Screen -->
    <!-- Window Header -->
    <rect x="30" y="30" width="260" height="22" rx="8" fill="#1E293B"/>
    <circle cx="42" cy="41" r="3.5" fill="#EF4444"/>
    <circle cx="53" cy="41" r="3.5" fill="#F59E0B"/>
    <circle cx="64" cy="41" r="3.5" fill="#10B981"/>
    <rect x="90" y="37" width="80" height="8" rx="4" fill="#334155"/>
    
    <!-- Screen Content: Code & Data Analytics Dashboard -->
    <!-- Left Sidebar -->
    <rect x="38" y="58" width="44" height="130" rx="4" fill="#1E293B"/>
    <rect x="44" y="66" width="32" height="5" rx="2" fill="#38BDF8"/>
    <rect x="44" y="78" width="26" height="4" rx="2" fill="#64748B"/>
    <rect x="44" y="88" width="28" height="4" rx="2" fill="#64748B"/>
    <rect x="44" y="98" width="22" height="4" rx="2" fill="#64748B"/>

    <!-- Main Code / Charts area -->
    <!-- Line numbers & Code tags -->
    <rect x="92" y="64" width="70" height="6" rx="3" fill="#60A5FA"/>
    <rect x="102" y="76" width="95" height="5" rx="2.5" fill="#A78BFA"/>
    <rect x="102" y="87" width="80" height="5" rx="2.5" fill="#34D399"/>
    <rect x="112" y="98" width="60" height="5" rx="2.5" fill="#FBBF24"/>
    <rect x="92" y="110" width="40" height="6" rx="3" fill="#60A5FA"/>

    <!-- Chart Mini Widget on Screen -->
    <rect x="195" y="62" width="85" height="60" rx="6" fill="#1E293B"/>
    <rect x="202" y="70" width="35" height="4" rx="2" fill="#94A3B8"/>
    <!-- Bar charts -->
    <rect x="205" y="96" width="10" height="20" rx="2" fill="#38BDF8"/>
    <rect x="220" y="84" width="10" height="32" rx="2" fill="#818CF8"/>
    <rect x="235" y="88" width="10" height="28" rx="2" fill="#34D399"/>
    <rect x="250" y="76" width="10" height="40" rx="2" fill="#F59E0B"/>

    <!-- Live Excel / Tally preview widget -->
    <rect x="92" y="128" width="188" height="58" rx="6" fill="#1E293B"/>
    <rect x="98" y="136" width="50" height="4" rx="2" fill="#10B981"/>
    <!-- Spreadsheet Grid Mock -->
    <line x1="98" y1="146" x2="274" y2="146" stroke="#334155" stroke-width="1"/>
    <line x1="98" y1="160" x2="274" y2="160" stroke="#334155" stroke-width="1"/>
    <line x1="98" y1="174" x2="274" y2="174" stroke="#334155" stroke-width="1"/>
    <rect x="102" y="150" width="30" height="6" rx="2" fill="#38BDF8"/>
    <rect x="145" y="150" width="35" height="6" rx="2" fill="#94A3B8"/>
    <rect x="195" y="150" width="30" height="6" rx="2" fill="#34D399"/>
    <rect x="240" y="150" width="28" height="6" rx="2" fill="#F59E0B"/>
  </g>

  <!-- Laptop & Accessories on Desk -->
  <g transform="translate(360, 260)" filter="url(#cardShadow)">
    <path d="M20 70 L140 70 L155 105 L5 105 Z" fill="#94A3B8"/>
    <rect x="30" y="74" width="100" height="22" rx="2" fill="#1E293B"/>
    <!-- Laptop screen opened -->
    <polygon points="20,70 140,70 135,5 25,5" fill="#334155"/>
    <polygon points="25,65 130,65 127,10 30,10" fill="#0F172A"/>
    <!-- Screen graphic -->
    <rect x="40" y="20" width="75" height="6" rx="3" fill="#38BDF8"/>
    <circle cx="78" cy="42" r="14" fill="#7C3AED" opacity="0.8"/>
  </g>

  <!-- Floating Feature Card 1: 100% Practical Learning -->
  <g transform="translate(40, 160)" filter="url(#cardShadow)">
    <rect width="180" height="64" rx="14" fill="#FFFFFF"/>
    <circle cx="36" cy="32" r="20" fill="#EFF6FF"/>
    <path d="M28 32 L34 38 L45 27" stroke="#2563EB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="66" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#0F172A">100% Practical</text>
    <text x="66" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" fill="#64748B">Lab Hands-on Training</text>
  </g>

  <!-- Floating Feature Card 2: Industry Certificate -->
  <g transform="translate(390, 80)" filter="url(#cardShadow)">
    <rect width="170" height="64" rx="14" fill="#FFFFFF"/>
    <circle cx="36" cy="32" r="20" fill="#FEF3C7"/>
    <!-- Mini Trophy / Ribbon Icon -->
    <path d="M28 24 L44 24 L41 34 C40 37 32 37 31 34 Z" fill="#F59E0B"/>
    <path d="M33 36 L39 36 L40 43 L32 43 Z" fill="#D97706"/>
    <text x="66" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#0F172A">Govt. Valid</text>
    <text x="66" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" fill="#64748B">Course Certificate</text>
  </g>

  <!-- Floating Feature Card 3: Career Ready -->
  <g transform="translate(50, 310)" filter="url(#cardShadow)">
    <rect width="170" height="60" rx="14" fill="#FFFFFF"/>
    <circle cx="34" cy="30" r="18" fill="#ECFDF5"/>
    <path d="M27 34 L33 24 L37 29 L43 21" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="62" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#0F172A">Job-Oriented</text>
    <text x="62" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="11" fill="#64748B">Career Guidance</text>
  </g>

  <!-- Floating Graduation Cap Badge -->
  <g transform="translate(265, 30)" filter="url(#cardShadow)">
    <circle cx="35" cy="35" r="30" fill="url(#brandGrad)"/>
    <g transform="translate(18, 18) scale(0.9)">
      <polygon points="18,3 34,10 18,17 2,10" fill="#FFFFFF"/>
      <path d="M6 12 L6 19 C6 25 30 25 30 19 L30 12" fill="#E0E7FF"/>
      <path d="M34 10 L34 22" stroke="#FDE047" stroke-width="2"/>
      <circle cx="34" cy="23" r="2" fill="#FDE047"/>
    </g>
  </g>

</svg>
