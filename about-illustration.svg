<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 480" width="550" height="480">
  <defs>
    <linearGradient id="aboutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="aboutShadow">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1E293B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Decorative Rings -->
  <circle cx="275" cy="240" r="190" fill="#F1F5F9" opacity="0.6"/>
  <circle cx="275" cy="240" r="150" fill="#E0E7FF" opacity="0.4"/>
  
  <!-- Main Frame / Card Layer -->
  <g transform="translate(60, 40)" filter="url(#aboutShadow)">
    <rect width="430" height="380" rx="20" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Header banner in card -->
    <rect x="0" y="0" width="430" height="80" rx="20" fill="url(#aboutGrad)"/>
    <rect x="0" y="60" width="430" height="20" fill="url(#aboutGrad)"/>
    
    <!-- Brand Title in Banner -->
    <text x="30" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="18" fill="#FFFFFF">PERFECT COMPUTER EDUCATION</text>
    <text x="30" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="12" fill="#E0E7FF">Excellence in IT & Practical Skills</text>

    <!-- Lab Scene Graphic Inside Card -->
    <!-- Workstation 1 -->
    <g transform="translate(35, 110)">
      <rect width="160" height="115" rx="10" fill="#0F172A"/>
      <rect x="6" y="6" width="148" height="80" rx="6" fill="#1E293B"/>
      <!-- Screen Graphic: Code & Web -->
      <rect x="15" y="16" width="60" height="6" rx="3" fill="#38BDF8"/>
      <rect x="15" y="28" width="90" height="4" rx="2" fill="#818CF8"/>
      <rect x="15" y="38" width="70" height="4" rx="2" fill="#34D399"/>
      <rect x="15" y="48" width="110" height="4" rx="2" fill="#FBBF24"/>
      <!-- Student Icon -->
      <circle cx="80" cy="140" r="16" fill="#2563EB"/>
      <path d="M55 175 C55 158 105 158 105 175 Z" fill="#3B82F6"/>
    </g>

    <!-- Workstation 2 -->
    <g transform="translate(235, 110)">
      <rect width="160" height="115" rx="10" fill="#0F172A"/>
      <rect x="6" y="6" width="148" height="80" rx="6" fill="#1E293B"/>
      <!-- Screen Graphic: Excel & Tally Charts -->
      <rect x="15" y="16" width="50" height="5" rx="2" fill="#10B981"/>
      <rect x="20" y="45" width="15" height="30" rx="2" fill="#38BDF8"/>
      <rect x="42" y="35" width="15" height="40" rx="2" fill="#10B981"/>
      <rect x="64" y="25" width="15" height="50" rx="2" fill="#F59E0B"/>
      <rect x="86" y="40" width="15" height="35" rx="2" fill="#EC4899"/>
      <!-- Student Icon -->
      <circle cx="80" cy="140" r="16" fill="#7C3AED"/>
      <path d="M55 175 C55 158 105 158 105 175 Z" fill="#8B5CF6"/>
    </g>

    <!-- Key Highlights Grid Inside Card -->
    <g transform="translate(30, 295)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="175" height="48" rx="8" fill="#EFF6FF"/>
      <circle cx="22" cy="24" r="12" fill="#DBEAFE"/>
      <path d="M17 24 L21 28 L27 20" stroke="#2563EB" stroke-width="2" stroke-linecap="round" fill="none"/>
      <text x="42" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11.5" fill="#1E293B">1:1 Individual Focus</text>
      <text x="42" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="10" fill="#64748B">Dedicated Mentor</text>

      <!-- Item 2 -->
      <rect x="195" y="0" width="175" height="48" rx="8" fill="#F5F3FF"/>
      <circle cx="217" cy="24" r="12" fill="#EDE9FE"/>
      <path d="M212 24 L216 28 L222 20" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" fill="none"/>
      <text x="237" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11.5" fill="#1E293B">Certified Trainers</text>
      <text x="237" y="36" font-family="'Plus Jakarta Sans', sans-serif" font-weight="500" font-size="10" fill="#64748B">5+ Yrs Experience</text>
    </g>
  </g>

  <!-- Floating Experience Stamp -->
  <g transform="translate(420, 320)" filter="url(#aboutShadow)">
    <circle cx="45" cy="45" r="42" fill="#FFFFFF"/>
    <circle cx="45" cy="45" r="36" fill="url(#aboutGrad)"/>
    <text x="45" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20" fill="#FFFFFF" text-anchor="middle">5+</text>
    <text x="45" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="9" fill="#E0E7FF" text-anchor="middle" letter-spacing="0.5">YEARS</text>
    <text x="45" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="7.5" fill="#FCD34D" text-anchor="middle">EXCELLENCE</text>
  </g>
</svg>
