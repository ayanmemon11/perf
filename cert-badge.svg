<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="badgeShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Ribbons -->
  <path d="M45 80 L35 110 L55 100 L75 110 L65 80 Z" fill="#DC2626" opacity="0.9"/>
  <path d="M45 80 L35 110 L50 102 Z" fill="#991B1B"/>
  <path d="M65 80 L75 110 L60 102 Z" fill="#B91C1C"/>

  <!-- Outer Star Burst -->
  <g filter="url(#badgeShadow)" transform="translate(60, 50)">
    <circle r="42" fill="url(#goldGrad)"/>
    <circle r="36" fill="#FFFFFF"/>
    <circle r="32" fill="url(#blueGrad)"/>
    
    <!-- Stars -->
    <path d="M0 -22 L3 -13 L12 -13 L5 -8 L8 1 L0 -4 L-8 1 L-5 -8 L-12 -13 L-3 -13 Z" fill="#FCD34D"/>
    
    <text x="0" y="8" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="10" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">VERIFIED</text>
    <text x="0" y="18" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="7" fill="#93C5FD" text-anchor="middle" letter-spacing="0.5">CERTIFICATE</text>
  </g>
</svg>
